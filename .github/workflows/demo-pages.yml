name: Deploy radio demo

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test demo behavior
        run: node --test demo/tests/*.test.mjs
      - name: Stage public site only
        run: |
          mkdir -p .test-runtime/demo-pages
          cp demo/index.html demo/styles.css demo/app.js demo/model.mjs .test-runtime/demo-pages/
          touch .test-runtime/demo-pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .test-runtime/demo-pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
